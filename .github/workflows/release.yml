name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build management UI
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Refresh embedded UI
        run: |
          find internal/httpapi/webdist -mindepth 1 -delete
          cp -R web/dist/. internal/httpapi/webdist/

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build Linux and Windows binaries
        shell: bash
        run: |
          mkdir -p release
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X ratewatch/internal/updater.Version=${VERSION} -X ratewatch/internal/updater.Commit=${COMMIT} -X ratewatch/internal/updater.BuildTime=${BUILD_TIME}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o release/ratewatch-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o release/ratewatch-windows-amd64.exe ./cmd/server
          cd release
          sha256sum ratewatch-linux-amd64 ratewatch-windows-amd64.exe > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "RateWatch $GITHUB_REF_NAME" --generate-notes --latest
          fi
